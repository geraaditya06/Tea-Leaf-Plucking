
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mp241-api
  labels:
    app: mp241-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: mp241-api

  template:
    metadata:
      labels:
        app: mp241-api

    spec:
      containers:
        - name: mp241-api
          image: mp241-api:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
              name: http

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

