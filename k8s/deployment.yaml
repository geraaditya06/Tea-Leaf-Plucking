apiVersion: apps/v1
kind: Deployment

metadata:
  name: tea-leaf-plucking
  labels:
    app: tea-leaf-plucking

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: tea-leaf-plucking

  template:
    metadata:
      labels:
        app: tea-leaf-plucking

    spec:
      containers:
        - name: tea-leaf-api
          image: tea-leaf-plucking-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
              name: http

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
